<g transform="translate(40 680)"><rect width="540" height="158" rx="15" fill="#211b17" stroke="#42352c"/><text x="24" y="36" class="mono muted">/01</text><path d="M488 24h22v22m0-22-24 24" fill="none" stroke="#f04e00" stroke-width="2"/><text x="24" y="77" class="service">APPS</text><text x="24" y="107" class="line">From idea to everyday utility.</text><text x="24" y="132" class="sub">Mobile experiences &amp; product interfaces.</text></g><g transform="translate(600 680)"><rect width="540" height="158" rx="15" fill="#211b17" stroke="#42352c"/><text x="24" y="36" class="mono muted">/02</text><path d="M488 24h22v22m0-22-24 24" fill="none" stroke="#f04e00" stroke-width="2"/><text x="24" y="77" class="service">GAMES</text><text x="24" y="107" class="line">Make something worth playing.</text><text x="24" y="132" class="sub">Interactive worlds &amp; browser experiences.</text></g><g transform="translate(40 858)"><rect width="540" height="158" rx="15" fill="#211b17" stroke="#42352c"/><text x="24" y="36" class="mono muted">/03</text><path d="M488 24h22v22m0-22-24 24" fill="none" stroke="#f04e00" stroke-width="2"/><text x="24" y="77" class="service">WEBSITES</text><text x="24" y="107" class="line">Your next first impression.</text><text x="24" y="132" class="sub">Business sites &amp; conversion-led pages.</text></g><g transform="translate(600 858)"><rect width="540" height="158" rx="15" fill="#211b17" stroke="#42352c"/><text x="24" y="36" class="mono muted">/04</text><path d="M488 24h22v22m0-22-24 24" fill="none" stroke="#f04e00" stroke-width="2"/><text x="24" y="77" class="service">SOFTWARE</text><text x="24" y="107" class="line">Build around the real problem.</text><text x="24" y="132" class="sub">Custom tools &amp; business workflows.</text></g><g transform="translate(40 1036)"><rect width="540" height="158" rx="15" fill="#211b17" stroke="#42352c"/><text x="24" y="36" class="mono muted">/05</text><path d="M488 24h22v22m0-22-24 24" fill="none" stroke="#f04e00" stroke-width=